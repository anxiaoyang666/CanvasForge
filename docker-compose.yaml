services:
  canvasforge:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-bookworm-slim}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian-security}
    container_name: canvasforge
    working_dir: /app
    ports:
      - "${CANVASFORGE_WEB_PORT:-3002}:3000"
    environment:
      CI: "true"
      TZ: Asia/Shanghai
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      CANVASFORGE_DATA_DIR: /app/data
      NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      CANVASFORGE_HOT_RELOAD_INTERVAL_MS: ${CANVASFORGE_HOT_RELOAD_INTERVAL_MS:-2500}
    volumes:
      - ./:/app
      - ./data:/app/data
      - canvasforge_node_modules:/app/node_modules
    command: sh /app/docker/start-dev.sh
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  canvasforge_node_modules:
